services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: sih-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ml-service:8000
      - CLIENT_URL=http://localhost:3003,http://localhost,http://127.0.0.1:3003
    depends_on:
      ml-service:
        condition: service_healthy

  frontend:
    build:
      context: ./jobify-frontend
      dockerfile: Dockerfile
    container_name: sih-frontend
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      - backend

networks:
  default:
    name: sih-network
